<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kubectl — The Complete Command Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --font-display:"Space Grotesk",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --font-body:"Inter","PingFang SC","Microsoft YaHei",sans-serif;
    --font-mono:"JetBrains Mono","SF Mono",Consolas,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  /* ============ DARK (default) ============ */
  html[data-theme="dark"]{
    --bg:#08090c; --bg-2:#0d0f14; --surface:#111319; --surface-2:#161922;
    --border:#1e2230; --border-hi:#2a3142;
    --ink:#f4f6fb; --ink-soft:#a8b0c2; --ink-mute:#626b80;
    --accent:#4d8dff; --accent-2:#00e5c4; --accent-glow:rgba(77,141,255,.45);
    --code-bg:#0a0c11; --code-ink:#8fe3d0; --code-border:#1a1e2a;
    --grid-line:rgba(255,255,255,.028);
    --glow-opacity:.55; --noise-opacity:.035;
  }
  /* ============ LIGHT ============ */
  html[data-theme="light"]{
    --bg:#f4f5f7; --bg-2:#eceef2; --surface:#ffffff; --surface-2:#f7f8fa;
    --border:#e2e5ea; --border-hi:#d0d5dd;
    --ink:#0d1117; --ink-soft:#3d4657; --ink-mute:#6b7488;
    --accent:#2f6bff; --accent-2:#00a88f; --accent-glow:rgba(47,107,255,.22);
    --code-bg:#f2f4f8; --code-ink:#0a5c66; --code-border:#dde2ea;
    --grid-line:rgba(10,15,30,.035);
    --glow-opacity:.28; --noise-opacity:.02;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-body);background:var(--bg);color:var(--ink);
    line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;position:relative;transition:background .5s var(--ease),color .5s var(--ease);
  }
  /* animated grid + glow backdrop */
  .backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:64px 64px;mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 78%);}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;
    opacity:var(--glow-opacity);transition:opacity .5s}
  .glow.g1{width:640px;height:640px;background:var(--accent);top:-260px;left:-160px}
  .glow.g2{width:520px;height:520px;background:var(--accent-2);top:-160px;right:-140px}
  #cursor-glow{position:fixed;width:520px;height:520px;border-radius:50%;z-index:0;pointer-events:none;
    background:radial-gradient(circle,var(--accent-glow),transparent 62%);
    transform:translate(-50%,-50%);opacity:0;transition:opacity .6s;mix-blend-mode:screen}
  html[data-theme="light"] #cursor-glow{mix-blend-mode:multiply}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px;position:relative;z-index:2}

  /* ============ HERO ============ */
  header{position:relative;z-index:2;padding:72px 0 34px}
  .eyebrow{display:flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:12.5px;
    letter-spacing:.24em;text-transform:uppercase;color:var(--accent-2);margin-bottom:26px;opacity:0;
    animation:rise .9s var(--ease-out) .1s forwards}
  .eyebrow i{width:15px;height:15px}
  h1.hero{font-family:var(--font-display);font-weight:700;line-height:.92;letter-spacing:-.04em;
    font-size:clamp(56px,11vw,148px);color:var(--ink)}
  h1.hero .l1,h1.hero .l2{display:block;overflow:hidden}
  h1.hero .l1 span,h1.hero .l2 span{display:block;transform:translateY(105%);
    animation:reveal 1.1s var(--ease-out) forwards}
  h1.hero .l1 span{animation-delay:.18s}
  h1.hero .l2 span{animation-delay:.32s;
    background:linear-gradient(100deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero-sub{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 26px;margin-top:30px;
    font-size:16px;color:var(--ink-soft);max-width:680px;opacity:0;
    animation:rise .9s var(--ease-out) .5s forwards}
  .hero-stats{display:flex;gap:40px;margin-top:44px;flex-wrap:wrap;opacity:0;
    animation:rise .9s var(--ease-out) .62s forwards}
  .stat .num{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,4.5vw,52px);
    line-height:1;letter-spacing:-.03em;
    background:linear-gradient(180deg,var(--ink),var(--ink-soft));-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  .stat .lbl{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-mute);margin-top:9px}
  .stat .num .u{font-size:.42em;color:var(--accent-2);-webkit-text-fill-color:var(--accent-2);margin-left:3px}

  /* ============ TOOLBAR ============ */
  .toolbar{position:sticky;top:0;z-index:30;padding:16px 0;margin-top:30px;
    background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);
    border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .toolbar .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .search-box{flex:1;min-width:240px;position:relative;display:flex;align-items:center}
  .search-box i{position:absolute;left:16px;width:18px;height:18px;color:var(--ink-mute);pointer-events:none}
  #search{width:100%;padding:14px 16px 14px 46px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;font-family:var(--font-body);font-size:15px;color:var(--ink);outline:none;
    transition:.25s var(--ease)}
  #search::placeholder{color:var(--ink-mute)}
  #search:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
  .count{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-mute);white-space:nowrap;
    display:flex;align-items:center;gap:7px}
  .count b{color:var(--accent-2);font-weight:600}
  .theme-btn{width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--surface);
    border:1px solid var(--border);border-radius:13px;cursor:pointer;color:var(--ink-soft);
    transition:.25s var(--ease)}
  .theme-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
  .theme-btn i{width:19px;height:19px}
  /* trigger button that opens the palette */
  .palette-trigger{display:inline-flex;align-items:center;gap:10px;padding:11px 18px 11px 15px;
    background:var(--surface);border:1px solid var(--border);border-radius:13px;cursor:pointer;
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:.04em;color:var(--ink-soft);
    transition:.25s var(--ease)}
  .palette-trigger:hover{border-color:var(--accent);color:var(--ink);transform:translateY(-1px);
    box-shadow:0 8px 24px var(--accent-glow)}
  .palette-trigger .pt-ico{width:17px;height:17px;color:var(--accent)}
  .palette-trigger .pt-cur{color:var(--ink);font-weight:500}
  .palette-trigger .pt-kbd{margin-left:4px;font-size:10.5px;padding:2px 7px;border-radius:6px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink-mute)}

  /* ===== category palette overlay ===== */
  .palette-scrim{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--bg) 55%,transparent);
    backdrop-filter:blur(10px) saturate(1.2);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
  .palette-scrim.open{opacity:1;pointer-events:auto}
  .palette{position:fixed;z-index:91;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
    width:min(940px,94vw);max-height:82vh;display:flex;flex-direction:column;
    background:color-mix(in srgb,var(--surface) 96%,transparent);border:1px solid var(--border-hi);
    border-radius:24px;overflow:hidden;opacity:0;pointer-events:none;
    box-shadow:0 40px 120px rgba(0,0,0,.5),0 0 0 1px var(--border) inset;
    transition:opacity .35s var(--ease),transform .35s var(--ease)}
  .palette.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .palette-hd{padding:22px 26px 16px;border-bottom:1px solid var(--border);position:relative}
  .palette-hd .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent-2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .palette-hd .lbl i{width:14px;height:14px}
  .palette-search{display:flex;align-items:center;gap:12px}
  .palette-search i{width:20px;height:20px;color:var(--ink-mute);flex:none}
  .palette-search input{flex:1;background:none;border:none;outline:none;font-family:var(--font-display);
    font-size:26px;font-weight:500;letter-spacing:-.02em;color:var(--ink)}
  .palette-search input::placeholder{color:var(--ink-mute)}
  .palette-esc{font-family:var(--font-mono);font-size:10.5px;padding:3px 9px;border-radius:7px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink-mute)}
  .palette-grid{padding:20px 26px 26px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
    grid-auto-rows:minmax(118px,auto);align-items:start;overflow-y:auto}
  @media(max-width:720px){.palette-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:440px){.palette-grid{grid-template-columns:1fr}}
  .pcell{position:relative;display:flex;flex-direction:column;gap:11px;padding:18px 16px 15px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:16px;cursor:pointer;
    overflow:hidden;transition:.22s var(--ease);text-align:left}
  .pcell::before{content:"";position:absolute;inset:0;border-radius:16px;opacity:0;transition:opacity .3s;
    background:radial-gradient(120px 90px at 30% 0%,var(--accent-glow),transparent 70%)}
  .pcell:hover,.pcell.kbd{border-color:var(--accent);transform:translateY(-3px);
    box-shadow:0 14px 34px var(--accent-glow)}
  .pcell:hover::before,.pcell.kbd::before{opacity:1}
  .pcell.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface-2))}
  .pcell.sel .pc-ico{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pc-top{display:flex;align-items:center;justify-content:space-between}
  .pc-ico{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;
    background:var(--surface);border:1px solid var(--border);color:var(--accent);transition:.22s var(--ease)}
  .pc-ico i{width:21px;height:21px}
  .pc-idx{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-mute);
    letter-spacing:.04em}
  .pc-name{font-family:var(--font-display);font-size:14.5px;font-weight:600;line-height:1.25;color:var(--ink);
    position:relative;z-index:1}
  .pc-cnt{font-family:var(--font-mono);font-size:11px;color:var(--ink-mute);position:relative;z-index:1}
  .pcell.sel .pc-cnt{color:var(--accent)}
  .pcell.hide{display:none}

  /* ============ CARDS ============ */
  main{position:relative;z-index:2;padding:52px 0 100px}
  .grid{columns:2;column-gap:26px}
  @media(max-width:900px){.grid{columns:1}}
  .card{background:color-mix(in srgb,var(--surface) 92%,transparent);
    border:1px solid var(--border);border-radius:20px;padding:26px 26px 22px;margin-bottom:26px;
    break-inside:avoid;position:relative;overflow:hidden;
    opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease),transform .7s var(--ease),border-color .3s}
  .card.in{opacity:1;transform:translateY(0)}
  .card::before{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;
    background:linear-gradient(140deg,var(--accent),transparent 40%);opacity:0;transition:opacity .4s;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .card:hover{border-color:var(--border-hi);transform:translateY(-4px)}
  .card:hover::before{opacity:.7}
  .card-head{display:flex;align-items:flex-start;gap:15px;margin-bottom:20px}
  .card-idx{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent-2);
    letter-spacing:.05em;padding-top:6px;min-width:26px}
  .card-ico{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--accent)}
  .card-ico i{width:19px;height:19px}
  .card-titles{flex:1;min-width:0}
  .card-titles h2{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:-.01em;
    color:var(--ink);line-height:1.2}
  .card-titles .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-mute);margin-top:5px;
    letter-spacing:.05em}
  .row{margin-bottom:13px}
  .row:last-child{margin-bottom:0}
  .row .desc{font-size:13px;color:var(--ink-soft);margin-bottom:6px;line-height:1.4}
  .cmd{display:block;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--code-border);
    border-radius:11px;padding:11px 40px 11px 14px;font-family:var(--font-mono);font-size:13px;
    line-height:1.5;position:relative;white-space:pre-wrap;word-break:break-all;cursor:pointer;
    transition:.2s var(--ease)}
  .cmd:hover{border-color:var(--accent);transform:translateX(3px)}
  .cmd .copy-i{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
    color:var(--ink-mute);transition:.2s}
  .cmd:hover .copy-i{color:var(--accent)}
  .cmd.copied{border-color:var(--accent-2)}
  .cmd.copied .copy-i{color:var(--accent-2)}
  .cmd mark{background:var(--accent);color:#fff;border-radius:3px;padding:0 2px}
  .no-result{text-align:center;color:var(--ink-mute);padding:80px 0;display:none;
    font-family:var(--font-mono);font-size:14px}
  .no-result i{width:34px;height:34px;display:block;margin:0 auto 16px;opacity:.5}

  /* ============ FOOTER ============ */
  footer{position:relative;z-index:2;border-top:1px solid var(--border);padding:40px 0}
  footer .in{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
    font-family:var(--font-mono);font-size:12.5px;color:var(--ink-mute)}
  footer a{color:var(--accent);text-decoration:none;transition:.2s}
  footer a:hover{color:var(--accent-2)}
  footer kbd{background:var(--surface);border:1px solid var(--border);border-bottom-width:2px;
    border-radius:6px;padding:2px 7px;font-size:11px;font-family:var(--font-mono);color:var(--ink-soft)}

  /* ============ TO-TOP ============ */
  #toTop{position:fixed;right:30px;bottom:30px;width:50px;height:50px;border-radius:15px;
    background:var(--accent);color:#fff;border:none;display:grid;place-items:center;cursor:pointer;
    box-shadow:0 10px 30px var(--accent-glow);opacity:0;transform:translateY(20px) scale(.9);
    pointer-events:none;transition:.35s var(--ease);z-index:40}
  #toTop.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  #toTop:hover{transform:translateY(-3px) scale(1.05)}
  #toTop i{width:21px;height:21px}
  #progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:50;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .1s linear}

  @keyframes reveal{to{transform:translateY(0)}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .eyebrow,.hero-sub,.hero-stats{transform:translateY(16px)}
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card{opacity:1;transform:none}
    h1.hero span{transform:none!important}
    .eyebrow,.hero-sub,.hero-stats{opacity:1;transform:none}
  }
  @media(max-width:640px){.wrap{padding:0 20px}header{padding:48px 0 24px}}
</style>
</head>
<body>
<div id="progress"></div>
<div class="backdrop"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div id="cursor-glow"></div>

<header>
  <div class="wrap">
    <div class="eyebrow"><i data-lucide="hexagon"></i>Kubernetes · Command Reference · v3.0</div>
    <h1 class="hero">
      <span class="l1"><span>kubectl</span></span>
      <span class="l2"><span>Command Atlas</span></span>
    </h1>
    <p class="hero-sub">一份为工程师打造的完整 kubectl 命令图谱。点击任意命令即可复制，实时搜索横跨全部资源类型 —— 从 Pod 到 CRD，从存储到 RBAC。</p>
    <div class="hero-stats">
      <div class="stat"><div class="num" id="s-cmd">0</div><div class="lbl">Commands</div></div>
      <div class="stat"><div class="num" id="s-cat">0</div><div class="lbl">Categories</div></div>
      <div class="stat"><div class="num">100<span class="u">%</span></div><div class="lbl">Copy Ready</div></div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="bar">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input id="search" type="text" placeholder="搜索命令或关键词，如 pvc / 日志 / scale / secret …" autocomplete="off">
      </div>
      <span class="count" id="count"></span>
      <button class="theme-btn" id="themeBtn" title="切换主题"><i data-lucide="moon"></i></button>
    </div>
    <button class="palette-trigger" id="paletteTrigger">
      <i data-lucide="layout-grid" class="pt-ico"></i>
      <span>分类 · <span class="pt-cur" id="ptCur">全部</span></span>
      <span class="pt-kbd">C</span>
    </button>
  </div>
</div>

<div class="palette-scrim" id="paletteScrim"></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="选择分类">
  <div class="palette-hd">
    <div class="lbl"><i data-lucide="layout-grid"></i>选择分类 · Jump to Category</div>
    <div class="palette-search">
      <i data-lucide="search"></i>
      <input id="paletteInput" type="text" placeholder="输入分类名过滤，↑↓ 选择，回车确认…" autocomplete="off">
      <span class="palette-esc">ESC</span>
    </div>
  </div>
  <div class="palette-grid" id="paletteGrid"></div>
</div>

<main>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="no-result" id="noResult"><i data-lucide="search-x"></i>没有匹配的命令，换个关键词试试</div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="in">
      <span>kubectl Command Atlas · v3.0</span>
      <span>数据整理自 <a href="https://kubernetes.io/docs/reference/kubectl/cheatsheet/" target="_blank">Kubernetes 官方文档</a></span>
      <span>快捷键 <kbd>/</kbd> 搜索 · <kbd>C</kbd> 分类 · <kbd>Esc</kbd> 清空</span>
    </div>
  </div>
</footer>

<button id="toTop" title="回到顶部"><i data-lucide="arrow-up"></i></button>

<script>
const DATA = [
  {cat:"上下文与配置", items:[
    {d:"查看 kubeconfig 配置", c:"kubectl config view"},
    {d:"查看合并后的完整配置(含密钥)", c:"kubectl config view --raw"},
    {d:"列出所有上下文", c:"kubectl config get-contexts"},
    {d:"查看当前上下文", c:"kubectl config current-context"},
    {d:"切换上下文", c:"kubectl config use-context <context-name>"},
    {d:"设置默认命名空间", c:"kubectl config set-context --current --namespace=<ns>"},
    {d:"新增/修改上下文", c:"kubectl config set-context <name> --cluster=<c> --user=<u> --namespace=<ns>"},
    {d:"删除上下文", c:"kubectl config delete-context <name>"},
    {d:"重命名上下文", c:"kubectl config rename-context <old> <new>"},
    {d:"指定 kubeconfig 文件", c:"kubectl --kubeconfig=/path/config get pods"},
  ]},
  {cat:"集群与 API", items:[
    {d:"查看客户端/服务端版本", c:"kubectl version"},
    {d:"仅看版本号(简洁)", c:"kubectl version -o yaml"},
    {d:"查看集群信息", c:"kubectl cluster-info"},
    {d:"导出集群诊断信息", c:"kubectl cluster-info dump --output-directory=./dump"},
    {d:"列出所有 API 资源类型", c:"kubectl api-resources"},
    {d:"列出命名空间级资源", c:"kubectl api-resources --namespaced=true"},

    {d:"给节点打污点", c:"kubectl taint nodes <node> key=value:NoSchedule"},
    {d:"移除污点(减号)", c:"kubectl taint nodes <node> key:NoSchedule-"},
    {d:"查看某节点上的 Pod", c:"kubectl get pods -A --field-selector spec.nodeName=<node>"},
  ]},
  {cat:"资源监控", items:[
    {d:"查看节点资源用量(需metrics-server)", c:"kubectl top nodes"},
    {d:"查看 Pod 资源用量", c:"kubectl top pods"},
    {d:"查看所有命名空间 Pod 用量", c:"kubectl top pods -A"},
    {d:"按 CPU 排序", c:"kubectl top pods --sort-by=cpu"},
    {d:"按内存排序", c:"kubectl top pods --sort-by=memory"},
    {d:"查看容器级用量", c:"kubectl top pods <pod> --containers"},
  ]},
  {cat:"CRD 自定义资源", items:[
    {d:"列出所有 CRD", c:"kubectl get crd"},
    {d:"查看 CRD 定义详情", c:"kubectl describe crd <name>"},
    {d:"查看某 CRD 的所有实例", c:"kubectl get <crd-plural-name> -A"},
    {d:"查看 CRD 支持的字段", c:"kubectl explain <crd-kind>"},
    {d:"删除 CRD(连带所有实例)", c:"kubectl delete crd <name>"},
  ]},
  {cat:"实用技巧", items:[
    {d:"设置命令别名", c:"alias k=kubectl"},
    {d:"启用 bash 自动补全", c:"source <(kubectl completion bash)"},
    {d:"启用 zsh 自动补全", c:"source <(kubectl completion zsh)"},
    {d:"让别名也支持补全", c:"complete -o default -F __start_kubectl k"},
    {d:"以 watch 每 2 秒刷新", c:"watch kubectl get pods"},
    {d:"查看资源的 YAML 但去除运行时字段", c:"kubectl get pod <name> -o yaml | kubectl-neat"},
    {d:"临时切命名空间执行", c:"kubectl -n kube-system get pods"},
    {d:"查看 kubectl 插件", c:"kubectl plugin list"},
    {d:"显示命令详细过程(调试)", c:"kubectl get pods -v=8"},
    {d:"等待资源就绪", c:"kubectl wait --for=condition=Ready pod/<name> --timeout=60s"},
  ]},
];

// icon mapping per category (Lucide names)
const ICONS={
  "上下文与配置":"settings-2","集群与 API":"server","查看与查询":"scan-search",
  "创建与应用":"file-plus-2","编辑与更新":"file-pen-line","标签与注解":"tags",
  "伸缩与自动扩缩":"scaling","滚动更新与回滚":"refresh-cw","Pod 管理":"box",
  "Deployment 部署":"layers","StatefulSet 有状态应用":"database","DaemonSet 守护进程集":"shield",
  "Job 与 CronJob":"clock","存储 PV / PVC / SC":"hard-drive","ConfigMap 与 Secret":"key-round",
  "Service 服务":"network","Ingress 与网络策略":"route","命名空间 Namespace":"folder-tree",
  "RBAC 权限与账户":"user-cog","权限自查 auth":"shield-check","配额与限制":"gauge",
  "删除资源":"trash-2","日志与调试":"terminal","网络与端口转发":"cable",
  "文件拷贝":"copy","节点与调度":"cpu","资源监控":"activity",
  "CRD 自定义资源":"puzzle","实用技巧":"sparkles"
};
const pad=n=>String(n).padStart(2,"0");

const grid=document.getElementById('grid');
const search=document.getElementById('search');
const noResult=document.getElementById('noResult');
const countEl=document.getElementById('count');
let activeCat="全部";
let io=null;

const totalCmd=DATA.reduce((s,d)=>s+d.items.length,0);

/* ===== category palette ===== */
const paletteTrigger=document.getElementById('paletteTrigger');
const paletteScrim=document.getElementById('paletteScrim');
const palette=document.getElementById('palette');
const paletteGrid=document.getElementById('paletteGrid');
const paletteInput=document.getElementById('paletteInput');
const ptCur=document.getElementById('ptCur');
const PCATS=[{cat:"全部",cnt:totalCmd,ico:"layers-3"},...DATA.map(d=>({cat:d.cat,cnt:d.items.length,ico:ICONS[d.cat]||"chevron-right"}))];
let kbdIdx=0;

function buildPalette(){
  paletteGrid.innerHTML='';
  PCATS.forEach((p,i)=>{
    const cell=document.createElement('button');
    cell.className='pcell'+(p.cat===activeCat?' sel':'');
    cell.dataset.cat=p.cat;cell.dataset.i=i;
    cell.innerHTML=`<div class="pc-top"><div class="pc-ico"><i data-lucide="${p.ico}"></i></div><div class="pc-idx">${i===0?'∗':pad(i)}</div></div>
      <div class="pc-name">${p.cat}</div><div class="pc-cnt">${p.cnt} commands</div>`;
    cell.onclick=()=>selectCat(p.cat);
    paletteGrid.appendChild(cell);
  });
  lucide.createIcons();
}
function selectCat(cat){
  activeCat=cat;ptCur.textContent=cat;
  paletteGrid.querySelectorAll('.pcell').forEach(c=>c.classList.toggle('sel',c.dataset.cat===cat));
  closePalette();render();window.scrollTo({top:document.querySelector('main').offsetTop-90,behavior:'smooth'});
}
function openPalette(){
  buildPalette();paletteScrim.classList.add('open');palette.classList.add('open');
  paletteInput.value='';filterPalette();
  const sel=[...paletteGrid.querySelectorAll('.pcell')].findIndex(c=>c.classList.contains('sel'));
  kbdIdx=sel<0?0:sel;markKbd();
  setTimeout(()=>paletteInput.focus(),120);
}
function closePalette(){paletteScrim.classList.remove('open');palette.classList.remove('open');paletteTrigger.focus();}
function filterPalette(){
  const q=paletteInput.value.trim().toLowerCase();
  let vis=[];
  paletteGrid.querySelectorAll('.pcell').forEach(c=>{
    const hit=!q||c.dataset.cat.toLowerCase().includes(q);
    c.classList.toggle('hide',!hit);if(hit)vis.push(c);
  });
  kbdIdx=0;markKbd(vis);
}
function markKbd(vis){
  const cells=vis||[...paletteGrid.querySelectorAll('.pcell:not(.hide)')];
  paletteGrid.querySelectorAll('.pcell').forEach(c=>c.classList.remove('kbd'));
  if(cells[kbdIdx]){cells[kbdIdx].classList.add('kbd');cells[kbdIdx].scrollIntoView({block:'nearest'});}
}
paletteTrigger.onclick=openPalette;
paletteScrim.onclick=closePalette;
paletteInput.addEventListener('input',filterPalette);
paletteInput.addEventListener('keydown',e=>{
  const cells=[...paletteGrid.querySelectorAll('.pcell:not(.hide)')];
  const cols=window.innerWidth<=440?1:window.innerWidth<=720?2:4;
  if(e.key==='ArrowDown'){e.preventDefault();kbdIdx=Math.min(kbdIdx+cols,cells.length-1);markKbd(cells);}
  else if(e.key==='ArrowUp'){e.preventDefault();kbdIdx=Math.max(kbdIdx-cols,0);markKbd(cells);}
  else if(e.key==='ArrowRight'){e.preventDefault();kbdIdx=Math.min(kbdIdx+1,cells.length-1);markKbd(cells);}
  else if(e.key==='ArrowLeft'){e.preventDefault();kbdIdx=Math.max(kbdIdx-1,0);markKbd(cells);}
  else if(e.key==='Enter'){e.preventDefault();if(cells[kbdIdx])selectCat(cells[kbdIdx].dataset.cat);}
  else if(e.key==='Escape'){e.preventDefault();closePalette();}
});


function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(text,q){
  const e=esc(text);
  if(!q)return e;
  try{return e.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');}
  catch(_){return e;}
}

function render(){
  const q=search.value.trim().toLowerCase();
  // While searching, always search globally (ignore the selected category filter).
  const effectiveCat=q?"全部":activeCat;
  grid.innerHTML='';let total=0,idx=0;
  DATA.forEach(group=>{
    if(effectiveCat!=="全部"&&group.cat!==effectiveCat)return;
    const matched=group.items.filter(it=>!q||it.d.toLowerCase().includes(q)||it.c.toLowerCase().includes(q));
    if(!matched.length)return;total+=matched.length;idx++;
    const card=document.createElement('div');card.className='card';
    const ico=ICONS[group.cat]||"chevron-right";
    let html=`<div class="card-head">
      <div class="card-idx">${pad(idx)}</div>
      <div class="card-ico"><i data-lucide="${ico}"></i></div>
      <div class="card-titles"><h2>${group.cat}</h2><div class="meta">${matched.length} commands</div></div>
    </div>`;
    matched.forEach(it=>{
      html+=`<div class="row"><div class="desc">${hl(it.d,q)}</div>
        <code class="cmd" data-cmd="${esc(it.c)}">${hl(it.c,q)}<i data-lucide="copy" class="copy-i"></i></code></div>`;
    });
    card.innerHTML=html;
    grid.appendChild(card);
  });
  noResult.style.display=total?'none':'block';
  const shownCats=grid.querySelectorAll('.card').length;
  const catCount=effectiveCat==="全部"?shownCats:1;
  countEl.innerHTML=`<b>${total}</b> commands · <b>${catCount}</b> ${catCount>1?'categories':'category'}`;
  lucide.createIcons();
  bindCopy();
  observeCards();
}

function bindCopy(){
  document.querySelectorAll('.cmd').forEach(cmd=>{
    cmd.onclick=()=>{
      const txt=cmd.getAttribute('data-cmd');
      navigator.clipboard.writeText(txt);
      cmd.classList.add('copied');
      const ic=cmd.querySelector('.copy-i');
      ic.setAttribute('data-lucide','check');lucide.createIcons();
      setTimeout(()=>{cmd.classList.remove('copied');ic.setAttribute('data-lucide','copy');lucide.createIcons();},1300);
    };
  });
}

function observeCards(){
  if(io)io.disconnect();
  const cards=[...document.querySelectorAll('.card:not(.in)')];
  // reveal any card already within the viewport immediately (staggered)
  let shown=0;
  cards.forEach(c=>{
    const r=c.getBoundingClientRect();
    if(r.top<innerHeight+120){setTimeout(()=>c.classList.add('in'),shown*55);shown++;}
  });
  io=new IntersectionObserver((es)=>{
    es.forEach((e,i)=>{if(e.isIntersecting){setTimeout(()=>e.target.classList.add('in'),i*55);io.unobserve(e.target);}});
  },{threshold:0,rootMargin:'0px 0px -60px 0px'});
  cards.forEach(c=>{if(!c.classList.contains('in'))io.observe(c);});
  // failsafe: never leave a card invisible
  clearTimeout(window.__revealFS);
  window.__revealFS=setTimeout(()=>document.querySelectorAll('.card:not(.in)').forEach(c=>{
    const r=c.getBoundingClientRect();if(r.top<innerHeight)c.classList.add('in');
  }),1200);
}

// search
search.addEventListener('input',render);
document.addEventListener('keydown',e=>{
  const inField=document.activeElement===search||document.activeElement===paletteInput;
  if(e.key==='/'&&!inField){e.preventDefault();search.focus();}
  if((e.key==='c'||e.key==='C')&&!inField&&!palette.classList.contains('open')){e.preventDefault();openPalette();}
  if(e.key==='Escape'&&document.activeElement===search){search.value='';render();search.blur();}
});

// theme
const html=document.documentElement,themeBtn=document.getElementById('themeBtn');
function setTheme(t){
  html.setAttribute('data-theme',t);
  themeBtn.innerHTML=`<i data-lucide="${t==='dark'?'moon':'sun'}"></i>`;
  lucide.createIcons();localStorage.setItem('kubectl-theme',t);
}
setTheme(localStorage.getItem('kubectl-theme')||'dark');
themeBtn.onclick=()=>setTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');

// cursor glow
const cg=document.getElementById('cursor-glow');
let cgOn=false;
window.addEventListener('mousemove',e=>{
  cg.style.left=e.clientX+'px';cg.style.top=e.clientY+'px';
  if(!cgOn){cg.style.opacity='1';cgOn=true;}
},{passive:true});

// scroll: progress + to-top
const toTop=document.getElementById('toTop'),progress=document.getElementById('progress');
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  progress.style.width=(scrollY/h*100)+'%';
  toTop.classList.toggle('show',scrollY>500);
},{passive:true});
toTop.onclick=()=>scrollTo({top:0,behavior:'smooth'});

// hero count-up
function countUp(el,target){
  let cur=0;const step=Math.max(1,Math.ceil(target/40));
  const t=setInterval(()=>{cur+=step;if(cur>=target){cur=target;clearInterval(t);}el.textContent=cur;},22);
}
countUp(document.getElementById('s-cmd'),totalCmd);
countUp(document.getElementById('s-cat'),DATA.length);

lucide.createIcons();
render();
</script>
</body>
</html>
